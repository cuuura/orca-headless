# Portainer 스택 또는 TrueNAS "Install via YAML"에 붙여넣기.
# 사전 준비는 데이터셋 하나뿐입니다 (README 참고):
#   zfs create -p <풀>/appdata/orca/home && chown -R 568:568 /mnt/<풀>/appdata/orca/home
services:
  orca:
    image: ghcr.io/cuuura/orca-headless:latest
    pull_policy: always          # 스택을 올릴 때마다 최신 이미지 확인
    restart: unless-stopped
    ports:
      - "36768:6768"
    environment:
      # [필수] 클라이언트가 접속할 주소.
      #  - 리버스 프록시:   "https://orca.example.com"  (전체 URL, wss로 자동 변환)
      #  - Tailscale/LAN:   "100.x.x.x" 처럼 IP만 → 이 경우 ports를 "36768:36768",
      #                     ORCA_PORT를 "36768"로 같이 바꿔야 포트가 맞습니다.
      PAIRING_ADDRESS: "CHANGE_ME"
      # ORCA_PORT: "6768"

      # [선택] 폰 페어링용 QR/링크가 필요하면 "--mobile-pairing"
      ORCA_EXTRA_ARGS: ""

      # [선택] Claude 로그인 자동화. PC에서 `claude setup-token`으로 발급한 토큰.
      #        비워 두면 컨테이너 셸에서 `claude`를 한 번 실행해 로그인합니다.
      CLAUDE_CODE_OAUTH_TOKEN: ""

      # [선택] Claude Code 기본 권한 모드. "bypassPermissions"면 확인 없이 실행합니다.
      #        격리된 컨테이너에서만 쓰고, git 토큰 권한은 좁게 두세요. 비우면 변경 없음.
      CLAUDE_PERMISSION_MODE: ""

      # [선택] 커밋 작성자 정보
      GIT_USER_NAME: ""
      GIT_USER_EMAIL: ""

      # [선택] git 서버 인증 (Forgejo/Gitea/GitHub 등, HTTPS). 토큰은 저장소 읽기/쓰기 권한만.
      GIT_HOST: ""          # 예: forgejo.example.com
      GIT_USERNAME: ""      # 로그인 아이디
      GIT_TOKEN: ""         # 액세스 토큰
      # 호스트가 더 있으면 공백으로 구분: "https://아이디:토큰@github.com https://..."
      GIT_CREDENTIALS: ""

      # Ouroboros 플러그인 설치 + `ouroboros setup` 자동 실행 (끄려면 "0")
      OUROBOROS_AUTO_SETUP: "1"
    volumes:
      # 로그인, 플러그인, Ouroboros 설정, 저장소가 모두 여기에 남습니다 (소유자 568:568)
      - /mnt/CHANGE_ME/appdata/orca/home:/home/orca
